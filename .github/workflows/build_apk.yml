name: Build Android APK

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code from git repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java JDK (required for Android Gradle build)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      # 4. Get Flutter packages
      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      # 5. Build Debug APK (No keystore signing required)
      - name: Build APK
        run: |
          cd mobile
          flutter build apk --debug

      # 6. Upload the built APK as a download artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-attendance-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
